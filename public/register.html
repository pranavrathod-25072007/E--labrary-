<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · E-Library</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234f46e5'/><path d='M6 6.5A2.5 2.5 0 0 1 8.5 4H12v14H8.5A2.5 2.5 0 0 0 6 20.5zM18 6.5A2.5 2.5 0 0 0 15.5 4H12v14h3.5a2.5 2.5 0 0 1 2.5 2.5z' fill='white'/></svg>">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <img src="images/jscoe-building.jpg" alt="JSCOE building">
        </span>
        <span>E-Library<small>JS College of Engineering</small></span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span></button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="books.html">Catalogue</a>
        <a href="notices.html">Notice Board</a>
        <a href="admin.html">Admin</a>
        <div class="mobile-auth" data-auth-slot></div>
      </nav>
      <div class="header-auth" data-auth-slot></div>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Registration is open to students and faculty of the college.</p>

      <div id="form-error" class="form-error hidden"></div>

      <form id="register-form" method="post" novalidate>
        <div class="field">
          <label for="name">Full name <span class="req">*</span></label>
          <input class="input" type="text" id="name" name="name" placeholder="e.g. Pranav Rathod" required autocomplete="name">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="roll_no">Roll no. / Employee ID</label>
            <input class="input" type="text" id="roll_no" name="roll_no" placeholder="e.g. 2226">
          </div>
          <div class="field">
            <label>I am a… <span class="req">*</span></label>
            <div class="radio-row">
              <label class="radio-pill"><input type="radio" name="role" value="student" checked><span>Student</span></label>
              <label class="radio-pill"><input type="radio" name="role" value="faculty"><span>Faculty</span></label>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="email">E-mail address <span class="req">*</span></label>
          <input class="input" type="email" id="email" name="email" placeholder="you@jscoe.edu.in" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password <span class="req">*</span></label>
          <input class="input" type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
        </div>
        <button class="btn btn-block btn-lg" type="submit" id="submit-btn">Create account</button>
      </form>

      <p class="small center muted" style="margin-top:16px">
        Already registered? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="js/main.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
